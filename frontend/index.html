<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Lab Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="page-header">
    <h1>AI Lab Dashboard</h1>
    <p>Provider health checks · model catalog · request runner</p>
  </header>

  <main>
    <section class="grid" id="providers">
      <article class="card" data-provider="openai">
        <h2>OpenAI</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>

      <article class="card" data-provider="anthropic">
        <h2>Anthropic</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>

      <article class="card" data-provider="gemini">
        <h2>Gemini</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>

      <article class="card" data-provider="openrouter">
        <h2>OpenRouter</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>

      <article class="card" data-provider="tavily" data-catalog="false">
        <h2>Tavily</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>

      <article class="card" data-provider="ollama">
        <h2>Ollama</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>

      <article class="card" data-provider="lmstudio">
        <h2>LM Studio</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>
    </section>

    <section class="catalog" id="model-catalog">
      <header class="catalog-header">
        <h2>Model Catalog</h2>
        <button type="button" class="catalog-toggle" id="catalog-toggle" aria-expanded="true">Hide</button>
      </header>

      <div class="catalog-body" id="catalog-body">
        <div class="catalog-controls">
          <label for="provider-select">Provider</label>
          <select id="provider-select"></select>
          <button type="button" class="catalog-refresh" id="catalog-refresh">Refresh</button>
          <span class="catalog-status" id="catalog-status"></span>
        </div>

        <div class="table-wrap">
          <table id="catalog-table">
            <thead>
              <tr>
                <th data-key="id" class="sortable">Model ID</th>
                <th data-key="context_window" class="sortable">Context Window</th>
                <th data-key="input_price_per_million" class="sortable">Input $/1M</th>
                <th data-key="output_price_per_million" class="sortable">Output $/1M</th>
              </tr>
            </thead>
            <tbody id="catalog-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="runner" id="request-runner">
      <header class="runner-header">
        <h2>Request Runner</h2>
      </header>

      <div class="runner-body">
        <div class="runner-controls">
          <label for="runner-provider">Provider</label>
          <select id="runner-provider"></select>

          <label for="runner-model" id="runner-model-label">Model</label>
          <select id="runner-model"></select>
          <button type="button" class="runner-refresh" id="runner-models-refresh">Refresh</button>
        </div>

        <textarea
          id="runner-prompt"
          class="runner-prompt"
          rows="6"
          placeholder="Enter a prompt…"
        ></textarea>

        <div class="runner-actions">
          <button type="button" id="runner-run">Run</button>
          <span class="runner-status" id="runner-status"></span>
        </div>

        <div class="runner-output hidden" id="runner-output">
          <div class="runner-metrics">
            <span>prompt tokens: <b data-metric="prompt_tokens">—</b></span>
            <span>completion tokens: <b data-metric="completion_tokens">—</b></span>
            <span>latency: <b data-metric="latency_ms">—</b> ms</span>
            <span class="runner-output-actions">
              <button type="button" id="runner-copy">Copy</button>
              <button type="button" id="runner-clear">Clear</button>
            </span>
          </div>
          <pre class="runner-text" id="runner-text"></pre>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
