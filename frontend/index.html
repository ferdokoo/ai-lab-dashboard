<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Lab Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="page-header">
    <h1>AI Lab Dashboard</h1>
    <p>Provider health checks</p>
  </header>

  <main>
    <section class="grid" id="providers">
      <article class="card" data-provider="openai">
        <h2>OpenAI</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>

      <article class="card" data-provider="anthropic">
        <h2>Anthropic</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>

      <article class="card" data-provider="gemini">
        <h2>Gemini</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>

      <article class="card" data-provider="openrouter">
        <h2>OpenRouter</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>

      <article class="card" data-provider="tavily">
        <h2>Tavily</h2>
        <div class="indicators">
          <span class="status" data-role="status"></span>
          <span class="latency" data-role="latency"></span>
        </div>
        <p class="error" data-role="error"></p>
        <button type="button" data-role="check">Check</button>
      </article>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
